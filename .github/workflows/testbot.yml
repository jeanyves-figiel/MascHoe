# Chat test bot (testing.md › Chat test bot, #109): deploys apps/testbot to thirstr-bot-staging.
# Staging only: there is no prod target on purpose.
name: Deploy test bot (staging)

on:
  push:
    branches: [main]
    paths:
      - apps/testbot/**
      - apps/mobile/src/chat/mls.ts
      - apps/mobile/src/chat/bytes.ts
      - infra/fly/testbot-staging.toml
      - .github/workflows/testbot.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-testbot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_TOKEN }}
      IMAGE: registry.fly.io/thirstr-bot-staging
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl auth docker
      - uses: docker/setup-buildx-action@v3
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/testbot/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          provenance: false
          cache-from: type=gha,scope=testbot
          cache-to: type=gha,mode=max,scope=testbot
      - name: Deploy by digest
        run: flyctl deploy --config infra/fly/testbot-staging.toml --app thirstr-bot-staging --image "${IMAGE}@${{ steps.push.outputs.digest }}" --wait-timeout 300
