# thirstr-api-staging (ops.md › Infra). EU regions only (D-03): CI rejects any other region.
app = "thirstr-api-staging"
primary_region = "fra"
kill_signal = "SIGTERM"

[deploy]
  release_command = "/app/bin/migrate"
  strategy = "rolling"

[env]
  DEPLOY_ENV = "staging"
  PHX_HOST = "thirstr-api-staging.fly.dev"
  APP_URL = "https://thirstr-api-staging.fly.dev"
  WEBAUTHN_ORIGIN = "https://thirstr-api-staging.fly.dev"
  WEBAUTHN_RP_ID = "thirstr-api-staging.fly.dev"
  PORT = "4000"
  ECTO_IPV6 = "true"
  SERVE_WEB_CLIENT = "true"
  WELCOME_DEFAULT_CITY = "Zurich"
  S3_REGION = "auto"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    hard_limit = 10000
    soft_limit = 8000

[[http_service.checks]]
  grace_period = "20s"
  interval = "15s"
  method = "GET"
  path = "/v1/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
